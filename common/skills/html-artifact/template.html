<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #000;
    --surface: #0a0a0a;
    --line: #1a1a1a;
    --text: #e6e6e6;
    --muted: #8a8a8a;
    --faint: #4d4d4d;
    --accent: #ff4545;
    --add: #3ddc84;
    --del: #ff6b6b;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); scroll-behavior: smooth; }
  body { margin: 0; color: var(--text); background: var(--bg); font: 14.5px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
  .layout {
    display: grid;
    grid-template-columns: 210px minmax(0, 720px);
    gap: 48px;
    max-width: 1010px;
    margin: 0 auto;
    padding: 48px 28px 96px;
  }
  nav { position: sticky; top: 48px; align-self: start; }
  nav ol { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  nav li { margin: 2px 0; }
  nav a { display: flex; gap: 10px; padding: 3px 0; color: var(--muted); text-decoration: none; }
  nav a:hover { color: var(--text); }
  nav .n { color: var(--faint); font-family: var(--mono); min-width: 12px; }
  nav .top { margin-bottom: 8px; }
  nav .top a { color: var(--text); }
  .eyebrow { font: 11.5px var(--mono); color: var(--muted); letter-spacing: .04em; }
  h1 { font-size: 26px; line-height: 1.25; font-weight: 600; margin: 8px 0 18px; letter-spacing: -.01em; }
  h2 { font-size: 18px; font-weight: 600; margin: 4px 0 6px; }
  h3 { font-size: 15px; font-weight: 600; margin: 0 0 6px; }
  p { margin: 0 0 10px; }
  strong { font-weight: 600; color: #fff; }
  ul { margin: 0 0 10px; padding-left: 18px; }
  li { margin: 3px 0; }
  code { font: 12.5px var(--mono); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .demo { margin: 22px 0 0; }
  .demo video { display: block; width: 100%; max-width: 560px; height: auto; border-radius: 6px; }
  .demo img { display: block; width: 100%; height: auto; border-radius: 6px; cursor: zoom-in; }
  .demo-pair { display: grid; gap: 16px; }
  .demo-pair.row { grid-template-columns: 1fr 1fr; max-width: 560px; }
  .demo-label { display: block; margin-bottom: 8px; font: 12px var(--mono); color: var(--muted); }
  .demo-labels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 560px; margin-bottom: 8px; font: 12px var(--mono); color: var(--muted); }
  .demo figcaption { max-width: 560px; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .commit { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--line); }
  .step { font: 11.5px var(--mono); color: var(--accent); letter-spacing: .04em; }
  .lead { color: var(--muted); }
  .step .subject { color: var(--muted); margin-left: 12px; }
  .block { margin-top: 26px; }
  .code { position: relative; margin-top: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
  .code-body { max-height: 128px; overflow: hidden; }
  .code::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 30px; height: 72px; pointer-events: none;
    background: linear-gradient(to bottom, rgba(10, 10, 10, 0), var(--surface));
  }
  .code.open .code-body { max-height: none; overflow-x: auto; }
  .code.open::after, .code.fits::after, .code.fits .toggle { display: none; }
  .path { font: 11.5px var(--mono); color: var(--faint); padding: 8px 12px 0; }
  pre { margin: 0; padding: 4px 12px 10px; font: 12px/1.55 var(--mono); color: #9a9a9a; }
  pre span { display: block; white-space: pre; }
  pre .add { color: var(--add); }
  pre .add::before { content: "+ "; color: var(--faint); }
  pre .del { color: var(--del); }
  pre .del::before { content: "- "; color: var(--faint); }
  pre .ctx::before { content: "  "; }
  pre .gap { color: var(--faint); }
  .toggle {
    display: block; width: 100%; padding: 7px 12px; border: 0; border-top: 1px solid var(--line);
    background: transparent; color: var(--muted); font: 12px var(--mono); text-align: left; cursor: pointer;
    border-radius: 0 0 6px 6px;
  }
  .toggle:hover { color: var(--text); }
  .viewer { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: var(--bg); }
  .viewer[hidden] { display: none; }
  .viewer figure { margin: 0; }
  .viewer img { display: block; max-width: calc(100vw - 112px); max-height: calc(100vh - 96px); margin: 0 auto; border-radius: 6px; }
  .viewer figcaption { max-width: 720px; margin: 10px auto 0; font-size: 13px; color: var(--muted); text-align: center; }
  .viewer .count { margin-right: 10px; font-family: var(--mono); color: var(--faint); }
  .viewer button { position: absolute; padding: 12px 16px; border: 0; background: transparent; color: var(--muted); font: 22px var(--mono); cursor: pointer; }
  .viewer button:hover { color: var(--text); }
  .viewer .prev { left: 4px; top: 50%; transform: translateY(-50%); }
  .viewer .next { right: 4px; top: 50%; transform: translateY(-50%); }
  .viewer .close { top: 4px; right: 4px; }
  .plain { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--line); }
  .plain h2 { margin-bottom: 10px; }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; gap: 24px; padding: 28px 18px 72px; }
    nav { position: static; }
  }
</style>
</head>
<body>
<div class="layout">
  <nav>
    <ol>
      <li class="top"><a href="#top">{{L_OVERVIEW}}</a></li>
      {{TOC}}
    </ol>
  </nav>
  <main>
    <header id="top">
      <div class="eyebrow">{{EYEBROW}}</div>
      <h1>{{TITLE}}</h1>
      {{INTRO}}
    </header>
    {{DEMO}}
    {{BODY}}
  </main>
</div>
<div class="viewer" hidden>
  <figure><img alt=""><figcaption><span class="count"></span><span class="text"></span></figcaption></figure>
  <button type="button" class="prev" aria-label="{{L_PREVIOUS}}">←</button>
  <button type="button" class="next" aria-label="{{L_NEXT}}">→</button>
  <button type="button" class="close" aria-label="{{L_CLOSE}}">×</button>
</div>
<script>
  document.querySelectorAll('.code').forEach(code => {
    const body = code.querySelector('.code-body');
    const toggle = code.querySelector('.toggle');
    // A page opened in a hidden tab or iframe has no layout yet, so the block stays
    // collapsed until it gets a real size and only then checks whether it fits.
    new ResizeObserver(() => {
      if (code.classList.contains('open') || !body.clientHeight) return;
      code.classList.toggle('fits', body.scrollHeight <= body.clientHeight + 4);
    }).observe(body);
    toggle.addEventListener('click', () => {
      const open = code.classList.toggle('open');
      toggle.textContent = open ? toggle.dataset.hide : toggle.dataset.show;
    });
  });
  const shots = [...document.querySelectorAll('.demo img')];
  const viewer = document.querySelector('.viewer');
  const big = viewer.querySelector('img');
  let current = 0;
  const show = index => {
    current = (index + shots.length) % shots.length;
    const shot = shots[current];
    const label = shot.parentElement.querySelector('.demo-label');
    const caption = shot.closest('figure').querySelector('figcaption');
    big.src = shot.src;
    big.alt = shot.alt;
    viewer.querySelector('.count').textContent = `${current + 1} / ${shots.length}`;
    viewer.querySelector('.text').textContent = [label?.textContent, caption?.textContent].filter(Boolean).join(': ');
    viewer.hidden = false;
    document.body.style.overflow = 'hidden';
  };
  const close = () => {
    viewer.hidden = true;
    big.removeAttribute('src');
    document.body.style.overflow = '';
  };
  shots.forEach((shot, index) => shot.addEventListener('click', () => show(index)));
  viewer.querySelectorAll('.prev, .next').forEach(button => {
    button.hidden = shots.length < 2;
    button.addEventListener('click', () => show(current + (button.classList.contains('next') ? 1 : -1)));
  });
  viewer.querySelector('.close').addEventListener('click', close);
  viewer.addEventListener('click', event => { if (event.target === viewer) close(); });
  document.addEventListener('keydown', event => {
    if (viewer.hidden) return;
    if (event.key === 'Escape') close();
    if (event.key === 'ArrowLeft' && shots.length > 1) show(current - 1);
    if (event.key === 'ArrowRight' && shots.length > 1) show(current + 1);
  });
</script>
</body>
</html>
